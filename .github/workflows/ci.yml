name: CI

# Roda a cada push na main e em todo pull request: os 59 testes do backend
# contra um MySQL de verdade, e lint + tipos + build do frontend.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + build)
    runs-on: ubuntu-latest

    services:
      # MySQL 8 igual ao de produção local; o Prisma aplica as migrations no
      # banco de teste antes de subir a API.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bloggers_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # A suíte só usa DATABASE_URL_TEST, mas prisma.config.ts e o build leem
      # DATABASE_URL, então as duas apontam para o serviço acima.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bloggers_test
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/bloggers_test
      JWT_SECRET: ci-only-secret-not-for-production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Gera o client do Prisma
        run: npx prisma generate

      - name: Testes (sobe a API na 3100 e 3101)
        run: npm test

      - name: Checagem de tipos (tsc via build)
        run: npm run build

  frontend:
    name: Frontend (lint + tipos + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      # O build não precisa da API no ar: as páginas que leem dados são
      # renderizadas sob demanda, não no prerender.
      - name: Build
        run: npm run build
